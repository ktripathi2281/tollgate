# Config for the gateway in docker-compose.yml. It is config.yaml with
# two differences: the admin listener binds to all interfaces inside the
# container, so Prometheus can scrape it over the compose network (compose
# doesn't publish it), and the comments are shorter. Secrets come from the
# environment: DATABASE_URL from compose, provider keys from .env.

server:
  addr: ":8080"
  admin_addr: ":6060"
  shutdown_grace: 30s

timeouts:
  first_token: 30s
  idle: 30s
  total: 300s

providers:
  # Disabled, with a warning, unless ANTHROPIC_API_KEY is set.
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  mock:
    type: mock
    ttft: 100ms
    token_interval: 10ms
    output_tokens: 50
  mock-flaky:
    type: mock
    ttft: 100ms
    token_interval: 10ms
    output_tokens: 50
    fail_at_chunk: 5

models:
  fast:
    default_max_tokens: 1024
    max_tokens_ceiling: 4096
    targets:
      - { provider: anthropic, model: claude-haiku-5-5, sampling: false }
  mock-fast:
    default_max_tokens: 256
    max_tokens_ceiling: 1024
    targets:
      - { provider: mock, model: mock-1 }
  mock-flaky:
    default_max_tokens: 256
    max_tokens_ceiling: 1024
    targets:
      - { provider: mock-flaky, model: mock-1 }

pricing:
  anthropic/claude-haiku-5-5:
    input: "0.10"
    output: "0.50"
    long_context: { above_prompt_tokens: 100000, input: "0.50", output: "2.50" }
  mock/mock-1: { input: "1.00", output: "2.00" }
  mock-flaky/mock-1: { input: "1.00", output: "2.00" }
