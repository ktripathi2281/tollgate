# Development config, used by `make run`.
#
# Secrets never go in this file. They come from the environment: provider
# keys from the variables named by each provider's api_key_env, and the
# database from DATABASE_URL. Fields left out take the defaults in
# internal/config.

server:
  addr: ":8080"
  shutdown_grace: 30s
  read_header_timeout: 10s
  max_body_bytes: 2097152
  max_inflight: 2000

log:
  level: info

# Per-request deadlines for upstream calls. first_token runs until a
# stream's first content; idle is the longest gap between chunks after
# that; total covers the whole request.
timeouts:
  first_token: 30s
  idle: 30s
  total: 300s

providers:
  # Anthropic's Messages API, with the key from ANTHROPIC_API_KEY (put it in
  # .env). Without the key the provider is disabled, with a warning at
  # startup, and requests for `fast` fail with a 502.
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  # A fake provider that generates text locally, so the gateway works
  # without any provider keys.
  mock:
    type: mock
    ttft: 100ms
    token_interval: 10ms
    output_tokens: 50
  # The same, but every stream fails with an error event in place of its
  # fifth word, to show what a mid-stream failure looks like.
  mock-flaky:
    type: mock
    ttft: 100ms
    token_interval: 10ms
    output_tokens: 50
    fail_at_chunk: 5

models:
  # A real model. Claude Haiku 5.5 rejects temperature and top_p, so its
  # target has sampling: false, and a request that sets them gets a 400
  # before any provider is called.
  fast:
    default_max_tokens: 1024
    max_tokens_ceiling: 4096
    targets:
      - { provider: anthropic, model: claude-haiku-5-5, sampling: false }
  mock-fast:
    default_max_tokens: 256
    max_tokens_ceiling: 1024
    targets:
      - { provider: mock, model: mock-1 }
  mock-flaky:
    default_max_tokens: 256
    max_tokens_ceiling: 1024
    targets:
      - { provider: mock-flaky, model: mock-1 }

# USD per million tokens, as decimal strings. Every target needs a price.
# The mock's price is fake but non-zero, so the cost path is exercised.
pricing:
  # From Anthropic's pricing page, 2026-10-12. A request whose prompt is
  # over 100,000 tokens (cached tokens included) pays the long-context
  # prices for all of its input and output.
  anthropic/claude-haiku-5-5:
    input: "0.10"
    output: "0.50"
    long_context: { above_prompt_tokens: 100000, input: "0.50", output: "2.50" }
  mock/mock-1: { input: "1.00", output: "2.00" }
  mock-flaky/mock-1: { input: "1.00", output: "2.00" }
