# A config with one mock-backed alias, for tests of `tollgate keys create
# -models`, which checks aliases against a config file.
providers:
  mock:
    type: mock
    output_tokens: 5
models:
  mock-fast:
    default_max_tokens: 64
    max_tokens_ceiling: 256
    targets:
      - { provider: mock, model: mock-1 }
pricing:
  mock/mock-1: { input: "1.00", output: "2.00" }
